<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BENS — Seguimiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF8F3; --ink:#241F1B; --ink-soft:#5B554C;
    --stone:#E7E1D3; --red:#D32F2F; --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:640px;margin:0 auto;padding:64px 20px;}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:600;margin:0 0 6px;}
  h1{font-family:'Fraunces',serif;font-size:30px;font-weight:600;margin:0 0 6px;}
  .who{color:var(--ink-soft);font-size:14px;margin:0 0 32px;}
  .card{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--card);border:1px solid var(--stone);border-radius:12px;
    padding:18px 20px;margin-bottom:10px;text-decoration:none;color:var(--ink);
    transition:border-color .15s ease, transform .1s ease;
  }
  .card:hover{border-color:var(--red);transform:translateY(-1px);}
  .card .label{font-weight:600;font-size:15px;}
  .card .arrow{color:var(--ink-soft);font-size:16px;}
  .empty{color:var(--ink-soft);font-size:14px;padding:20px 0;line-height:1.6;}
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">BENS Hotels Group</p>
    <h1>Seguimiento</h1>
    <p class="who">Conectado como <b>{{ username }}</b></p>

    {% if sections %}
      {% for s in sections %}
      <a class="card" href="/s/{{ s.id }}">
        <span class="label">{{ s.label }}</span>
        <span class="arrow">→</span>
      </a>
      {% endfor %}
    {% else %}
      <p class="empty">Tu usuario todavía no tiene ninguna sección asignada.<br>Pedile a quien administra el sistema que te dé acceso.</p>
    {% endif %}
  </div>
</body>
</html>
