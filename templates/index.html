<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento — Esteban & Dueños</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF8F3;
    --card:#FFFFFF;
    --ink:#241F1B;
    --ink-soft:#5B554C;
    --stone:#E7E1D3;
    --stone-dark:#D8CFBA;
    --red:#D32F2F;
    --red-dark:#A62424;
    --sage:#3F7A5D;
    --sage-bg:#E7F1EC;
    --amber:#B9812B;
    --amber-bg:#F5EBD8;
    --red-bg:#FBE7E5;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:880px;margin:0 auto;padding:28px 20px 90px;}

  /* ---------- Header ---------- */
  header.hero{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:24px;
    padding-bottom:22px;
    border-bottom:1px solid var(--stone);
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--red);
    font-weight:600;
    margin:0 0 6px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-size:30px;
    font-weight:600;
    margin:0 0 4px;
    line-height:1.15;
  }
  .subtitle{
    color:var(--ink-soft);
    font-size:14.5px;
    margin:0;
    max-width:360px;
  }
  .gauge-wrap{
    display:flex;
    align-items:center;
    gap:14px;
    flex-shrink:0;
  }
  .gauge{position:relative;width:78px;height:78px;}
  .gauge svg{transform:rotate(-90deg);}
  .gauge-pct{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces', serif;
    font-size:19px;font-weight:600;
  }
  .gauge-stats{font-size:13px;color:var(--ink-soft);line-height:1.5;}
  .gauge-stats b{color:var(--ink);font-weight:600;}
  .gauge-stats .red-count{color:var(--red);font-weight:600;}

  /* ---------- Toolbar ---------- */
  .toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    margin-bottom:14px;
  }
  input[type=text], input[type=number], input[type=date], textarea{
    font-family:inherit;
    border:1px solid var(--stone-dark);
    background:var(--card);
    border-radius:8px;
    padding:9px 11px;
    font-size:14px;
    color:var(--ink);
  }
  input[type=text]:focus, input[type=number]:focus, input[type=date]:focus, textarea:focus{
    outline:none;
    border-color:var(--red);
    box-shadow:0 0 0 3px rgba(211,47,47,.1);
  }
  .search-input{flex:1;min-width:180px;}
  .threshold-field{
    display:flex;align-items:center;gap:6px;
    font-size:13px;color:var(--ink-soft);
    background:var(--card);
    border:1px solid var(--stone);
    border-radius:8px;
    padding:4px 10px;
  }
  .threshold-field input{width:46px;text-align:center;padding:5px 4px;border:none;background:transparent;font-weight:600;}
  .threshold-field input:focus{box-shadow:none;}

  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    padding:9px 15px;
    transition:transform .06s ease, background .15s ease;
  }
  button:active{transform:scale(.97);}
  .btn-primary{background:var(--red);color:#fff;}
  .btn-primary:hover{background:var(--red-dark);}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--stone-dark);}
  .btn-ghost:hover{background:var(--stone);color:var(--ink);}
  .btn-text{background:none;color:var(--red);padding:4px 6px;font-size:13px;}
  .btn-text:hover{text-decoration:underline;}

  /* ---------- Panels (add / bulk) ---------- */
  .panel{
    background:var(--card);
    border:1px solid var(--stone);
    border-radius:12px;
    padding:16px;
    margin-bottom:14px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:flex-end;
  }
  .panel label{
    display:flex;flex-direction:column;gap:5px;
    font-size:12px;color:var(--ink-soft);font-weight:500;
  }
  .panel textarea{width:100%;min-height:90px;resize:vertical;}
  .panel-actions{display:flex;gap:8px;margin-left:auto;}

  /* ---------- List ---------- */
  main#list{display:flex;flex-direction:column;gap:8px;}
  .row{
    background:var(--card);
    border:1px solid var(--stone);
    border-radius:12px;
    padding:12px 14px;
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .row.done{opacity:.68;}
  .check-wrap{display:flex;align-items:center;flex-shrink:0;}
  .check-wrap input[type=checkbox]{
    width:21px;height:21px;
    accent-color:var(--sage);
    cursor:pointer;
  }
  .names{display:flex;flex-direction:column;gap:4px;min-width:190px;flex:1.4;}
  .names input{border:none;background:transparent;padding:2px 0;font-weight:600;font-size:14.5px;}
  .names input.owner{font-weight:400;color:var(--ink-soft);font-size:13px;}
  .names input:focus{box-shadow:none;border-bottom:1px solid var(--red);border-radius:0;}

  .status-pill{
    display:flex;align-items:center;gap:6px;
    font-size:12.5px;
    padding:5px 10px;
    border-radius:999px;
    flex-shrink:0;
    white-space:nowrap;
  }
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .status-sage{background:var(--sage-bg);color:var(--sage);}
  .status-sage .dot{background:var(--sage);}
  .status-amber{background:var(--amber-bg);color:var(--amber);}
  .status-amber .dot{background:var(--amber);}
  .status-red{background:var(--red-bg);color:var(--red);}
  .status-red .dot{background:var(--red);}

  .date-field{display:flex;flex-direction:column;gap:2px;flex-shrink:0;}
  .date-field label{font-size:10.5px;color:var(--ink-soft);letter-spacing:.03em;text-transform:uppercase;}
  .date-field input{padding:6px 8px;font-size:12.5px;}

  .risk-meter{display:flex;gap:4px;align-items:center;flex-shrink:0;}
  .risk-dot{
    width:22px;height:22px;border-radius:50%;
    border:2px solid transparent;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:10px;font-weight:700;font-family:inherit;
    cursor:pointer;padding:0;
    opacity:.5;transform:scale(.82);
    transition:opacity .15s ease, transform .15s ease, border-color .15s ease;
  }
  .risk-dot:hover{opacity:.85;}
  .risk-dot.active{
    opacity:1;transform:scale(1);
    border-color:rgba(0,0,0,.28);
    box-shadow:0 0 0 3px rgba(0,0,0,.05);
  }

  .row-actions{display:flex;align-items:center;gap:4px;margin-left:auto;flex-shrink:0;}
  .icon-btn{
    background:transparent;border:none;color:var(--ink-soft);
    font-size:13px;padding:6px 8px;border-radius:6px;
  }
  .icon-btn:hover{background:var(--stone);color:var(--ink);}
  .icon-btn.danger:hover{background:var(--red-bg);color:var(--red);}

  .notes-area{
    width:100%;
    margin-top:6px;
    display:none;
  }
  .notes-area.open{display:block;}
  .notes-area textarea{width:100%;min-height:56px;font-size:13px;resize:vertical;}

  /* ---------- Empty state ---------- */
  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-soft);
    border:1px dashed var(--stone-dark);
    border-radius:12px;
    background:var(--card);
  }
  .empty p{margin:0 0 14px;font-size:14.5px;}

  /* ---------- Footer / save indicator ---------- */
  footer{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:20px;flex-wrap:wrap;gap:10px;
  }
  .save-indicator{
    position:fixed;bottom:18px;right:18px;
    font-size:12.5px;color:var(--ink-soft);
    background:var(--card);
    border:1px solid var(--stone);
    padding:7px 13px;border-radius:999px;
    opacity:0;transition:opacity .3s ease;
    display:flex;align-items:center;gap:6px;
  }
  .save-indicator.show{opacity:1;}
  .save-indicator .dot-live{width:6px;height:6px;border-radius:50%;background:var(--sage);}

  .loading{padding:60px 0;text-align:center;color:var(--ink-soft);font-size:14px;}

  .filter-chips{display:flex;gap:6px;flex-wrap:wrap;}
  .filter-chip{
    background:var(--card);
    border:1px solid var(--stone-dark);
    color:var(--ink-soft);
    font-size:12.5px;font-weight:600;
    padding:7px 12px;border-radius:999px;
  }
  .filter-chip:hover{background:var(--stone);}
  .filter-chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .undo-toast{
    position:fixed;bottom:18px;left:18px;
    display:flex;align-items:center;gap:12px;
    background:var(--ink);color:#fff;
    padding:11px 12px 11px 16px;border-radius:10px;
    font-size:13.5px;
    box-shadow:0 6px 18px rgba(0,0,0,.18);
    transform:translateY(12px);opacity:0;pointer-events:none;
    transition:all .2s ease;
    max-width:320px;
  }
  .undo-toast.show{transform:translateY(0);opacity:1;pointer-events:auto;}
  .undo-toast button{
    background:rgba(255,255,255,.14);color:#fff;
    padding:6px 12px;font-size:12.5px;border-radius:7px;
    flex-shrink:0;
  }
  .undo-toast button:hover{background:rgba(255,255,255,.24);}

  @media (max-width:640px){
    header.hero{flex-direction:column;}
    .row{align-items:stretch;}
    .names{flex:1 1 100%;}
    .row-actions{margin-left:0;}
    .date-field{flex:1;}
  }
</style>
</head>
<body>
<div class="app">

  <header class="hero">
    <div>
      <p class="eyebrow">BENS Hotels Group</p>
      <h1>Vínculo con dueños</h1>
      <p class="subtitle">Quién falta que Esteban llame o visite.</p>
    </div>
    <div class="gauge-wrap">
      <div class="gauge">
        <svg width="78" height="78" viewBox="0 0 78 78">
          <circle cx="39" cy="39" r="34" fill="none" stroke="#E7E1D3" stroke-width="8"/>
          <circle id="gaugeRing" cx="39" cy="39" r="34" fill="none" stroke="#3F7A5D" stroke-width="8"
                  stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="213.6"/>
        </svg>
        <div class="gauge-pct" id="gaugePct">0%</div>
      </div>
      <div class="gauge-stats">
        <div><b id="statTotal">0</b> hoteles</div>
        <div><span class="red-count" id="statAtrasados">0</span> atrasados</div>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <input type="text" class="search-input" id="searchInput" placeholder="Buscar hotel o dueño…">
    <div class="threshold-field">
      Aviso a los <input type="number" id="thresholdInput" min="1" value="30"> días
    </div>
    <button class="btn-primary" id="btnAdd">+ Agregar hotel</button>
    <button class="btn-ghost" id="btnBulk">Agregar varios</button>
  </div>

  <div class="filter-chips" id="filterChips">
    <button class="filter-chip active" data-filter="all">Todos</button>
    <button class="filter-chip" data-filter="atrasados">Atrasados</button>
    <button class="filter-chip" data-filter="riesgo">Riesgo alto (4-5)</button>
  </div>

  <div class="panel" id="addPanel" style="display:none;">
    <label>Hotel<input type="text" id="newHotel" placeholder="Ej. Hotel del Puerto"></label>
    <label>Dueño / contacto<input type="text" id="newOwner" placeholder="Ej. Marcelo Ríos"></label>
    <label>Último contacto (opcional)<input type="date" id="newDate"></label>
    <label>Nivel de riesgo inicial<div class="risk-meter" id="newRiskMeter"></div></label>
    <div class="panel-actions">
      <button class="btn-ghost" id="cancelAdd">Cancelar</button>
      <button class="btn-primary" id="confirmAdd">Agregar</button>
    </div>
  </div>

  <div class="panel" id="bulkPanel" style="display:none;">
    <label style="width:100%;">
      Una línea por hotel — "Hotel - Dueño" o "Hotel - Dueño - Nivel" (nivel opcional, de 2 a 5)
      <textarea id="bulkText" placeholder="Hotel del Puerto - Marcelo Ríos - 4
Posada del Sur - Carla Núñez"></textarea>
    </label>
    <div class="panel-actions">
      <button class="btn-ghost" id="cancelBulk">Cancelar</button>
      <button class="btn-primary" id="confirmBulk">Agregar todos</button>
    </div>
  </div>

  <main id="list">
    <div class="loading">Cargando seguimiento…</div>
  </main>

</div>

<div class="save-indicator" id="saveIndicator">
  <span class="dot-live"></span><span id="saveText">Guardado</span>
</div>

<div class="undo-toast" id="undoToast">
  <span id="undoText"></span>
  <button id="undoBtn">Deshacer</button>
</div>

<script>
let state = { threshold: 30, hotels: [] };
let searchTerm = '';
let activeFilter = 'all';
let newHotelRisk = 2;
let lastDeleted = null;
let undoTimer = null;
let saveTimer = null;

function todayISO(){ return new Date().toISOString().slice(0,10); }
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2)); }

function isTyping(){
  const a = document.activeElement;
  return a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && document.getElementById('list').contains(a);
}

async function loadState(silent){
  try{
    const res = await fetch('/api/state');
    if(res.ok){
      const data = await res.json();
      state.threshold = data.threshold ?? 30;
      state.hotels = Array.isArray(data.hotels) ? data.hotels : [];
    }
  }catch(e){
    if(!silent) console.error('No se pudo cargar el seguimiento:', e);
  }
  document.getElementById('thresholdInput').value = state.threshold;
  render();
}

async function persist(){
  showSave('saving');
  try{
    const res = await fetch('/api/state', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ threshold: state.threshold, hotels: state.hotels })
    });
    showSave(res.ok ? 'saved' : 'error');
  }catch(e){
    showSave('error');
    console.error('Error guardando seguimiento:', e);
  }
}
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persist, 350);
}
function showSave(mode){
  const el = document.getElementById('saveIndicator');
  const txt = document.getElementById('saveText');
  el.classList.add('show');
  txt.textContent = mode === 'saving' ? 'Guardando…' : (mode === 'error' ? 'No se pudo guardar' : 'Guardado');
  clearTimeout(el._hideTimer);
  if(mode !== 'saving'){
    el._hideTimer = setTimeout(()=> el.classList.remove('show'), 1600);
  }
}

function riskColor(n){
  const hue = 140 - (n - 2) * (140/3); // 2=verde(140) ... 5=rojo(0)
  return `hsl(${hue}, 55%, 42%)`;
}

function computeStatus(lastContact, threshold){
  if(!lastContact) return { days:null, color:'red', text:'Sin contacto registrado' };
  const days = Math.max(0, Math.floor((Date.now() - new Date(lastContact+'T00:00:00').getTime()) / 86400000));
  let color = 'sage';
  if(days > threshold) color = 'red';
  else if(days > threshold * 0.6) color = 'amber';
  const text = days === 0 ? 'Hoy' : days === 1 ? 'Hace 1 día' : `Hace ${days} días`;
  return { days, color, text };
}

function autoRiskFloor(lastContact){
  if(!lastContact) return 5;
  const days = Math.max(0, Math.floor((Date.now() - new Date(lastContact+'T00:00:00').getTime()) / 86400000));
  return Math.min(5, 2 + Math.floor(days/7));
}

function applyAutoEscalation(){
  let changed = false;
  state.hotels.forEach(h=>{
    const floor = autoRiskFloor(h.lastContact);
    const current = h.riesgo || 2;
    if(floor > current){ h.riesgo = floor; changed = true; }
  });
  if(changed) scheduleSave();
}

function el(tag, attrs={}, ...children){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k === 'class') e.className = v;
    else if(k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2).toLowerCase(), v);
    else if(k === 'value') e.value = v;
    else if(k === 'checked') e.checked = v;
    else e.setAttribute(k, v);
  }
  children.flat().forEach(c=>{
    if(c == null) return;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return e;
}

function render(){
  applyAutoEscalation();
  renderStats();
  const list = document.getElementById('list');
  list.innerHTML = '';

  let hotels = state.hotels.slice();
  if(searchTerm){
    const q = searchTerm.toLowerCase();
    hotels = hotels.filter(h => h.hotel.toLowerCase().includes(q) || h.dueño.toLowerCase().includes(q));
  }
  if(activeFilter === 'atrasados'){
    hotels = hotels.filter(h => computeStatus(h.lastContact, state.threshold).color === 'red');
  } else if(activeFilter === 'riesgo'){
    hotels = hotels.filter(h => (h.riesgo || 2) >= 4);
  }

  if(state.hotels.length === 0){
    list.appendChild(el('div', {class:'empty'},
      el('p', {}, 'Todavía no agregaste hoteles. Sumá el primero para empezar a hacer seguimiento.'),
      el('button', {class:'btn-primary', onClick: ()=> togglePanel('addPanel', true)}, '+ Agregar hotel')
    ));
    return;
  }
  if(hotels.length === 0){
    list.appendChild(el('div', {class:'empty'}, el('p', {}, 'No hay hoteles que coincidan con la búsqueda o el filtro elegido.')));
    return;
  }

  hotels.sort((a,b)=>{
    const sa = computeStatus(a.lastContact, state.threshold);
    const sb = computeStatus(b.lastContact, state.threshold);
    const contactedA = sa.days !== null && sa.days <= state.threshold;
    const contactedB = sb.days !== null && sb.days <= state.threshold;
    if(contactedA !== contactedB) return contactedA ? 1 : -1;
    const rank = {red:0, amber:1, sage:2};
    if(rank[sa.color] !== rank[sb.color]) return rank[sa.color] - rank[sb.color];
    const ra = a.riesgo || 2, rb = b.riesgo || 2;
    if(ra !== rb) return rb - ra;
    return a.hotel.localeCompare(b.hotel);
  });

  hotels.forEach(hotel => list.appendChild(renderRow(hotel)));
}

function renderRow(hotel){
  const status = computeStatus(hotel.lastContact, state.threshold);
  const effectiveContacted = status.days !== null && status.days <= state.threshold;

  const checkbox = el('input', {
    type:'checkbox', checked: effectiveContacted,
    onChange: (e)=>{
      if(e.target.checked){
        hotel.lastContact = todayISO();
        hotel.riesgo = 2;
      } else {
        hotel.lastContact = null;
      }
      scheduleSave(); render();
    }
  });

  const hotelInput = el('input', {
    type:'text', value: hotel.hotel, class:'hotel',
    onBlur: (e)=>{ hotel.hotel = e.target.value.trim() || hotel.hotel; scheduleSave(); render(); }
  });
  const ownerInput = el('input', {
    type:'text', value: hotel.dueño, class:'owner', placeholder:'Dueño / contacto',
    onBlur: (e)=>{ hotel.dueño = e.target.value.trim(); scheduleSave(); }
  });

  const dateInput = el('input', {
    type:'date', value: hotel.lastContact || '',
    onChange: (e)=>{ hotel.lastContact = e.target.value || null; scheduleSave(); render(); }
  });

  const currentRisk = hotel.riesgo || 2;
  const riskMeter = el('div', {class:'risk-meter'});
  for(let n=2; n<=5; n++){
    riskMeter.appendChild(el('button', {
      type:'button',
      class: 'risk-dot' + (currentRisk === n ? ' active' : ''),
      style: `background:${riskColor(n)}`,
      title: `Nivel ${n}`,
      onClick: ()=>{ hotel.riesgo = n; scheduleSave(); render(); }
    }, String(n)));
  }

  const notesOpen = !!hotel._notesOpen;
  const notesBtn = el('button', {
    class:'icon-btn',
    onClick: ()=>{ hotel._notesOpen = !hotel._notesOpen; render(); }
  }, hotel.notes ? '📝 Notas' : '+ Nota');

  const deleteBtn = el('button', {
    class:'icon-btn danger',
    title:'Eliminar',
    onClick: ()=>{
      const idx = state.hotels.findIndex(h => h.id === hotel.id);
      if(idx === -1) return;
      lastDeleted = { hotel: state.hotels[idx], index: idx };
      state.hotels.splice(idx, 1);
      scheduleSave(); render();
      showUndo(hotel.hotel);
    }
  }, '✕');

  const row = el('div', {class:'row' + (effectiveContacted ? ' done' : '')},
    el('div', {class:'check-wrap'}, checkbox),
    el('div', {class:'names'}, hotelInput, ownerInput),
    riskMeter,
    el('div', {class:`status-pill status-${status.color}`}, el('span', {class:'dot'}), status.text),
    el('div', {class:'date-field'}, el('label', {}, 'Último contacto'), dateInput),
    el('div', {class:'row-actions'}, notesBtn, deleteBtn)
  );

  const notesArea = el('div', {class:'notes-area' + (notesOpen ? ' open' : '')},
    el('textarea', {
      placeholder:'Notas sobre la relación, temas pendientes, próximos pasos…',
      onBlur: (e)=>{ hotel.notes = e.target.value; scheduleSave(); }
    }, hotel.notes || '')
  );

  const wrapper = el('div', {style:'width:100%;'}, row, notesArea);
  return wrapper;
}

function renderStats(){
  const total = state.hotels.length;
  const alDia = state.hotels.filter(h=>{
    const s = computeStatus(h.lastContact, state.threshold);
    return s.days !== null && s.days <= state.threshold;
  }).length;
  const atrasados = state.hotels.filter(h=> computeStatus(h.lastContact, state.threshold).color === 'red').length;
  const pct = total ? Math.round(100*alDia/total) : 0;

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statAtrasados').textContent = atrasados;
  document.getElementById('gaugePct').textContent = pct + '%';

  const ring = document.getElementById('gaugeRing');
  const circumference = 213.6;
  ring.setAttribute('stroke-dashoffset', circumference * (1 - pct/100));
  ring.setAttribute('stroke', pct >= 70 ? '#3F7A5D' : pct >= 40 ? '#B9812B' : '#D32F2F');
}

function showUndo(name){
  clearTimeout(undoTimer);
  const toast = document.getElementById('undoToast');
  document.getElementById('undoText').textContent = `Eliminaste "${name}".`;
  toast.classList.add('show');
  undoTimer = setTimeout(()=>{
    toast.classList.remove('show');
    lastDeleted = null;
  }, 7000);
}

function buildNewRiskPicker(){
  const wrap = document.getElementById('newRiskMeter');
  wrap.innerHTML = '';
  for(let n=2; n<=5; n++){
    const dot = el('button', {
      type:'button',
      class: 'risk-dot' + (newHotelRisk === n ? ' active' : ''),
      style: `background:${riskColor(n)}`,
      title: `Nivel ${n}`,
      onClick: ()=>{
        newHotelRisk = n;
        wrap.querySelectorAll('.risk-dot').forEach(d => d.classList.remove('active'));
        dot.classList.add('active');
      }
    }, String(n));
    wrap.appendChild(dot);
  }
}

function togglePanel(id, show){
  document.getElementById(id).style.display = show ? 'flex' : 'none';
  if(show){
    const other = id === 'addPanel' ? 'bulkPanel' : 'addPanel';
    document.getElementById(other).style.display = 'none';
  }
}

// ---- Wiring ----
document.getElementById('btnAdd').addEventListener('click', ()=> togglePanel('addPanel', true));
document.getElementById('btnBulk').addEventListener('click', ()=> togglePanel('bulkPanel', true));
document.getElementById('cancelAdd').addEventListener('click', ()=> togglePanel('addPanel', false));
document.getElementById('cancelBulk').addEventListener('click', ()=> togglePanel('bulkPanel', false));

document.getElementById('confirmAdd').addEventListener('click', ()=>{
  const hotel = document.getElementById('newHotel').value.trim();
  const dueño = document.getElementById('newOwner').value.trim();
  const date = document.getElementById('newDate').value || null;
  if(!hotel){ alert('Poné al menos el nombre del hotel.'); return; }
  state.hotels.push({ id: uid(), hotel, dueño, lastContact: date, notes:'', riesgo:newHotelRisk });
  document.getElementById('newHotel').value = '';
  document.getElementById('newOwner').value = '';
  document.getElementById('newDate').value = '';
  newHotelRisk = 2;
  buildNewRiskPicker();
  togglePanel('addPanel', false);
  scheduleSave(); render();
});

document.getElementById('confirmBulk').addEventListener('click', ()=>{
  const raw = document.getElementById('bulkText').value;
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  lines.forEach(line=>{
    const parts = line.split(/\s-\s|\t/);
    const hotel = (parts[0] || '').trim();
    const dueño = (parts[1] || '').trim();
    let riesgo = parseInt((parts[2] || '').trim(), 10);
    if(isNaN(riesgo) || riesgo < 2 || riesgo > 5) riesgo = 2;
    if(hotel) state.hotels.push({ id: uid(), hotel, dueño, lastContact:null, notes:'', riesgo });
  });
  document.getElementById('bulkText').value = '';
  togglePanel('bulkPanel', false);
  scheduleSave(); render();
});

document.getElementById('searchInput').addEventListener('input', (e)=>{
  searchTerm = e.target.value;
  render();
});

document.getElementById('thresholdInput').addEventListener('change', (e)=>{
  const v = parseInt(e.target.value, 10);
  state.threshold = (isNaN(v) || v < 1) ? 30 : v;
  scheduleSave(); render();
});

document.querySelectorAll('.filter-chip').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    activeFilter = btn.dataset.filter;
    document.querySelectorAll('.filter-chip').forEach(b => b.classList.toggle('active', b === btn));
    render();
  });
});

document.getElementById('undoBtn').addEventListener('click', ()=>{
  if(!lastDeleted) return;
  const pos = Math.min(lastDeleted.index, state.hotels.length);
  state.hotels.splice(pos, 0, lastDeleted.hotel);
  lastDeleted = null;
  clearTimeout(undoTimer);
  document.getElementById('undoToast').classList.remove('show');
  scheduleSave(); render();
});

buildNewRiskPicker();
loadState();
setInterval(()=>{ if(!isTyping()) loadState(true); }, 20000);
</script>
</body>
</html>
